<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tremble ❤ Sbowen</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000008;
    overflow: hidden;
    font-family: 'Georgia', 'STSong', 'PingFang SC', 'Microsoft YaHei', serif;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    position: fixed; width: 100%; height: 100%;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }

  #hint {
    position: fixed; bottom: 2.5rem; left: 50%; transform: translateX(-50%);
    z-index: 5; color: rgba(255,255,255,0.55);
    font-size: 0.95rem; letter-spacing: 0.2em;
    transition: opacity 0.8s; pointer-events: none;
    animation: hintBounce 2.5s ease-in-out infinite;
  }
  #hint.hide { opacity: 0; }
  @keyframes hintBounce {
    0%,100% { opacity: 0.4; transform: translateX(-50%) translateY(0); }
    50% { opacity: 1; transform: translateX(-50%) translateY(-6px); }
  }
</style>
</head>
<body>
<div id="hint">↓ 开始旅程</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ==================== 场景基础 ====================
const isMobile = /Mobi|Android|iPhone/i.test(navigator.userAgent) || window.innerWidth < 768;
const aspect = window.innerWidth / window.innerHeight;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000010, 0.000012);

const fov = isMobile ? 78 : 70;
const camera = new THREE.PerspectiveCamera(fov, aspect, 0.2, 200);
camera.position.set(0, 0.3, 6.5);
camera.lookAt(0, 0.5, -1);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
document.body.appendChild(renderer.domElement);

// ==================== 灯光 ====================
scene.add(new THREE.AmbientLight(0x1a1040, 0.7));
const pinkLight = new THREE.PointLight(0xff6b9d, 10, 12, 1.5);
pinkLight.position.set(0, 2, 5);
scene.add(pinkLight);
const blueLight = new THREE.PointLight(0x6ec6ff, 4, 20, 2);
blueLight.position.set(-5, 0, -30);
scene.add(blueLight);
const purpleLight = new THREE.PointLight(0xc44dff, 5, 20, 2);
purpleLight.position.set(5, 1, -50);
scene.add(purpleLight);

// ==================== 星空 ====================
function createStarfield() {
  const count = 5000;
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 35 + Math.random() * 85;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i*3] = Math.sin(ph)*Math.cos(th)*r;
    pos[i*3+1] = Math.sin(ph)*Math.sin(th)*r;
    pos[i*3+2] = Math.cos(ph)*r;
    const c = Math.random();
    if (c < 0.55) { col[i*3]=0.8+Math.random()*0.2; col[i*3+1]=0.82+Math.random()*0.18; col[i*3+2]=1; }
    else if (c < 0.8) { col[i*3]=1; col[i*3+1]=0.45+Math.random()*0.3; col[i*3+2]=0.55+Math.random()*0.3; }
    else { col[i*3]=0.45+Math.random()*0.3; col[i*3+1]=0.55+Math.random()*0.3; col[i*3+2]=1; }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({ size: 0.13, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.85 });
  const stars = new THREE.Points(geo, mat);
  stars.name = 'stars';
  scene.add(stars);
  return stars;
}
const stars = createStarfield();

// ==================== 精致 3D 爱心 (高密度细颗粒) ====================
function createHeart() {
  function hx(t) { return 16 * Math.pow(Math.sin(t), 3); }
  function hy(t) { return 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t); }

  const scale = 4.2;
  const layers = 25;
  const perLayer = 200;
  const total = layers * perLayer;

  const pos = new Float32Array(total * 3);
  const col = new Float32Array(total * 3);

  for (let l = 0; l < layers; l++) {
    const zFrac = (l / (layers - 1) - 0.5) * 2; // -1 to 1
    const zDepth = zFrac * 0.65;
    const shrink = Math.sqrt(1 - zFrac * zFrac * 0.85);

    for (let i = 0; i < perLayer; i++) {
      const t = (i / perLayer + Math.random() * 0.02) * Math.PI * 2;
      const idx = (l * perLayer + i) * 3;

      const jitter = 0.94 + Math.random() * 0.12;
      pos[idx] = (hx(t) / 16) * scale * shrink * jitter;
      pos[idx + 1] = (hy(t) / 17) * scale * shrink * jitter + 0.8;
      pos[idx + 2] = zDepth * scale;

      const yNorm = (hy(t) / 17 + 1) / 2;
      col[idx] = 0.92 + yNorm * 0.08;
      col[idx + 1] = 0.1 + yNorm * 0.3;
      col[idx + 2] = 0.22 + yNorm * 0.25;
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

  const mat = new THREE.PointsMaterial({
    size: 0.045,
    vertexColors: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    opacity: 0.9,
  });

  const heart = new THREE.Points(geo, mat);
  heart.name = 'heart';
  heart.position.set(0, 0.2, -1.5);
  scene.add(heart);

  // 光晕层
  const glowCount = 800;
  const glowPos = new Float32Array(glowCount * 3);
  const glowCol = new Float32Array(glowCount * 3);
  for (let i = 0; i < glowCount; i++) {
    const t = Math.random() * Math.PI * 2;
    const zFrac = (Math.random() - 0.5) * 2;
    const zDepth = zFrac * 0.7;
    const jitter = 0.96 + Math.random() * 0.13;
    const shrink = Math.sqrt(1 - zFrac * zFrac * 0.85);
    glowPos[i*3] = (hx(t)/16) * scale * shrink * jitter;
    glowPos[i*3+1] = (hy(t)/17) * scale * shrink * jitter + 0.8;
    glowPos[i*3+2] = zDepth * scale;
    glowCol[i*3] = 0.85; glowCol[i*3+1] = 0.4; glowCol[i*3+2] = 0.7;
  }
  const glowGeo = new THREE.BufferGeometry();
  glowGeo.setAttribute('position', new THREE.BufferAttribute(glowPos, 3));
  glowGeo.setAttribute('color', new THREE.BufferAttribute(glowCol, 3));
  const glowMat = new THREE.PointsMaterial({ size: 0.13, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.28 });
  const glow = new THREE.Points(glowGeo, glowMat);
  glow.name = 'heartGlow';
  glow.position.copy(heart.position);
  scene.add(glow);

  return { heart, glow };
}
const heartGroup = createHeart();

// ==================== Canvas 纹理工具 ====================
function makeTextSprite(text, fontSize, color, maxWidth) {
  const canvas = document.createElement('canvas');
  canvas.width = 2048;
  canvas.height = 384;
  const ctx = canvas.getContext('2d');
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
  gradient.addColorStop(0, '#ff6b9d');
  gradient.addColorStop(0.4, '#ff9a76');
  gradient.addColorStop(0.7, '#c44dff');
  gradient.addColorStop(1, '#6ec6ff');
  ctx.fillStyle = gradient;
  ctx.font = `bold ${fontSize}px Georgia, "PingFang SC", "Microsoft YaHei", serif`;
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);

  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.colorSpace = THREE.SRGBColorSpace;

  const spriteMat = new THREE.SpriteMaterial({
    map: texture,
    blending: THREE.NormalBlending,
    depthWrite: false,
    transparent: true,
  });
  const sprite = new THREE.Sprite(spriteMat);
  const aspectRatio = canvas.width / canvas.height;
  sprite.scale.set(maxWidth, maxWidth / aspectRatio, 1);
  return sprite;
}

// 封面标题
const titleSprite = makeTextSprite('Tremble  ❤  Sbowen', 110, '#fff', isMobile ? 5.5 : 7);
titleSprite.position.set(0, 3.6, -1.5);
titleSprite.name = 'titleSprite';
scene.add(titleSprite);

const subtitleSprite = makeTextSprite('✦  穿越星际，只为与你相遇  ✦', 42, '#fff', isMobile ? 4 : 5.5);
subtitleSprite.position.set(0, -3.2, -1.5);
subtitleSprite.name = 'subtitleSprite';
scene.add(subtitleSprite);

// 创建文字 Plane（用于最终画面）
function makeTextPlane(text, subText) {
  const canvas = document.createElement('canvas');
  canvas.width = 2048;
  canvas.height = 1024;
  const ctx = canvas.getContext('2d');

  // 背景完全透明
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 主文字
  const gradient = ctx.createLinearGradient(0, 300, 0, 650);
  gradient.addColorStop(0, '#ff6b9d');
  gradient.addColorStop(0.5, '#ff9a76');
  gradient.addColorStop(1, '#ffc1cc');
  ctx.fillStyle = gradient;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 100px Georgia, "PingFang SC", "Microsoft YaHei", serif';
  ctx.fillText('I love you,', canvas.width / 2, 370);
  ctx.fillText('from this day,', canvas.width / 2, 490);
  ctx.fillText('until my last day.', canvas.width / 2, 610);

  // 副文字
  ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.font = '42px Georgia, "PingFang SC", "Microsoft YaHei", serif';
  ctx.fillText('✦  你是我宇宙中最亮的星  ✦', canvas.width / 2, 760);

  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.colorSpace = THREE.SRGBColorSpace;

  const geo = new THREE.PlaneGeometry(isMobile ? 5 : 7, isMobile ? 2.5 : 3.5);
  const mat = new THREE.MeshBasicMaterial({
    map: texture,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
  });
  const plane = new THREE.Mesh(geo, mat);
  plane.name = 'finalTextPlane';
  return plane;
}

// ==================== 阶段系统 ====================
// 每个阶段定义: z 位置、照片组
const stageDefs = [
  { type: 'cover', z: 0 },
  { type: 'photos', z: -10, photos: ['1.jpg'], captions: ['最特别的你'] },
  { type: 'photos', z: -20, photos: ['IMG_4192.jpg', 'IMG_4257.PNG', 'IMG_5746.jpg'], captions: ['最美的瞬间', '甜蜜的回忆', '和你在一起'] },
  { type: 'photos', z: -30, photos: ['IMG_6034.jpg', 'IMG_6978.JPG', 'IMG_7465.JPG'], captions: ['心动的每一刻', '你眼里的星光', '陪伴是长情'] },
  { type: 'photos', z: -40, photos: ['1/1.JPG', '1/2.png', '1/IMG_7234.jpg'], captions: ['独特的你', '温暖如你', '甜甜的回忆'] },
  { type: 'photos', z: -50, photos: ['1/IMG_7463.JPG', '1/IMG_7464.JPG', '2/IMG_4640.jpg'], captions: ['时光与你', '定格美好', '每一个笑容'] },
  { type: 'photos', z: -60, photos: ['2/IMG_4663.jpg', '2/IMG_7234.jpg'], captions: ['你是我的光', '遇见你真好'] },
  { type: 'photos', z: -70, photos: ['结果/ChatGPT Image 2026年5月4日 01_12_07.png','结果/ChatGPT Image 2026年5月4日 01_27_26.png','结果/ChatGPT Image 2026年5月4日 01_51_09.png'], captions: ['星辰为你闪烁', '你是宇宙的礼物', '最爱你的微笑'] },
  { type: 'photos', z: -80, photos: ['结果/ChatGPT Image 2026年5月4日 02_08_48.png','结果/ChatGPT Image 2026年5月4日 02_17_36.png','结果/ChatGPT Image 2026年5月4日 14_05_37.png'], captions: ['浪漫时刻', '星空下的我们', '永恒的瞬间'] },
  { type: 'photos', z: -90, photos: ['结果/ChatGPT Image 2026年5月4日 15_18_02.png','结果/ChatGPT Image 2026年5月4日 15_57_18.png','结果/ChatGPT Image 2026年5月4日 16_03_44.png'], captions: ['你是我的唯一', '想和你去看星星', '我们的故事'] },
  { type: 'final', z: -100 },
];

const totalStages = stageDefs.length; // 11 stages: 0=cover, 1-9=photos, 10=final

// ==================== 照片墙创建 ====================
const textureLoader = new THREE.TextureLoader();
const photoWalls = []; // array of groups, one per photo stage

function createPhotoWall(stageIndex) {
  const def = stageDefs[stageIndex];
  if (def.type !== 'photos') return null;

  const group = new THREE.Group();
  const n = def.photos.length;
  const contentZ = def.z;

  // 竖屏布局 — 照片垂直堆叠
  const photoW = n === 1 ? 3.2 : 2.6;
  const photoH = n === 1 ? 3.6 : (n === 2 ? 2.6 : 2.0);
  const gap = n === 1 ? 0 : 0.35;
  const totalH = n * photoH + (n - 1) * gap;

  def.photos.forEach((photoPath, i) => {
    const yOffset = totalH / 2 - photoH / 2 - i * (photoH + gap);

    const geo = new THREE.PlaneGeometry(photoW, photoH);
    const mat = new THREE.MeshBasicMaterial({
      color: 0x1a1030,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(0, yOffset, 0);
    mesh.userData = { photoPath, caption: def.captions[i] };

    // 编码路径（中文文件名支持）
    const encodedPath = photoPath.split('/').map(s => encodeURIComponent(s)).join('/');
    textureLoader.load(
      encodedPath,
      (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
        mat.map = tex;
        mat.color.set(0xffffff);
        mat.needsUpdate = true;
      },
      undefined,
      (err) => {
        console.warn('Photo load failed:', encodedPath, err);
        // 回退：尝试原始路径
        if (encodedPath !== photoPath) {
          textureLoader.load(photoPath,
            (tex2) => {
              tex2.colorSpace = THREE.SRGBColorSpace;
              mat.map = tex2;
              mat.color.set(0xffffff);
              mat.needsUpdate = true;
            },
            undefined,
            () => { mat.color.set(0x331133); }
          );
        } else {
          mat.color.set(0x331133);
        }
      }
    );

    group.add(mesh);
  });

  // 装饰粒子边框
  const decoCount = 60;
  const decoPos = new Float32Array(decoCount * 3);
  for (let i = 0; i < decoCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = photoW * 0.7 + Math.random() * 0.8;
    const h = (Math.random() - 0.5) * (totalH + 1);
    decoPos[i*3] = Math.cos(angle) * r;
    decoPos[i*3+1] = h;
    decoPos[i*3+2] = (Math.random() - 0.5) * 0.5;
  }
  const decoGeo = new THREE.BufferGeometry();
  decoGeo.setAttribute('position', new THREE.BufferAttribute(decoPos, 3));
  const decoMat = new THREE.PointsMaterial({ size: 0.05, color: 0xff6b9d, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.5 });
  const decoPoints = new THREE.Points(decoGeo, decoMat);
  group.add(decoPoints);

  // 放在 z = contentZ，面向 +Z（摄像机会从 +Z 方向看过来）
  group.position.set(0, 0, contentZ);
  group.name = `photoWall_${stageIndex}`;
  scene.add(group);
  return group;
}

// 创建所有照片墙
stageDefs.forEach((def, i) => {
  if (def.type === 'photos') {
    photoWalls[i] = createPhotoWall(i);
  }
});

// 创建最终文字 Plane
const finalPlane = makeTextPlane();
finalPlane.position.set(0, 0, stageDefs[totalStages - 1].z);
scene.add(finalPlane);

// ==================== 导航状态 ====================
let currentStage = 0;
let targetStage = 0;
let isTransitioning = false;
let transitionT = 0;
let transitionStartPos = new THREE.Vector3();
let transitionEndPos = new THREE.Vector3();
let transitionControl = new THREE.Vector3();
let transitionStartLook = new THREE.Vector3();
let transitionEndLook = new THREE.Vector3();
let journeyComplete = false;

function getCamPosForStage(stage) {
  const z = stageDefs[stage].z;
  return new THREE.Vector3(0, 0.3, z + 5.5);
}

function getLookTargetForStage(stage) {
  const z = stageDefs[stage].z;
  return new THREE.Vector3(0, 0.5, z);
}

function startTransition(fromStage, toStage) {
  isTransitioning = true;
  transitionT = 0;
  transitionStartPos.copy(camera.position);
  transitionEndPos.copy(getCamPosForStage(toStage));
  transitionStartLook.copy(getLookTargetForStage(fromStage));
  transitionEndLook.copy(getLookTargetForStage(toStage));

  // 之字形控制点：在起点和终点中间，偏移到左或右
  const midZ = (transitionStartPos.z + transitionEndPos.z) / 2;
  const midX = (toStage % 2 === 0) ? 3.5 : -3.5; // 交替左右
  const midY = (transitionStartPos.y + transitionEndPos.y) / 2 + (toStage % 3 === 0 ? 1 : -0.8);
  transitionControl.set(midX, midY, midZ);
}

function advance() {
  if (isTransitioning || journeyComplete) return;
  if (targetStage < totalStages - 1) {
    const from = targetStage;
    targetStage++;
    startTransition(from, targetStage);
    if (targetStage === totalStages - 1) {
      journeyComplete = true;
    }
  }
}

function retreat() {
  if (isTransitioning) return;
  if (targetStage > 0) {
    journeyComplete = false;
    const from = targetStage;
    targetStage--;
    startTransition(from, targetStage);
  }
}

// ==================== 输入事件 ====================
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    advance();
  }
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
    e.preventDefault();
    retreat();
  }
});

let touchStartY = 0;
window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchend', (e) => {
  const dy = touchStartY - e.changedTouches[0].clientY;
  if (dy > 35) advance();
  if (dy < -35) retreat();
});

window.addEventListener('wheel', (e) => {
  if (e.deltaY > 0) advance();
  else if (e.deltaY < 0) retreat();
});

// ==================== 动画循环 ====================
const clock = new THREE.Clock();
const hintEl = document.getElementById('hint');

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const elapsed = performance.now() * 0.001;

  // 处理过渡动画
  if (isTransitioning) {
    transitionT += dt * 0.55; // 过渡速度
    if (transitionT >= 1) {
      transitionT = 1;
      isTransitioning = false;
      currentStage = targetStage;
    }

    // 二次贝塞尔 B(t) = (1-t)²P0 + 2(1-t)tP1 + t²P2
    const t = transitionT;
    const mt = 1 - t;
    const pos = new THREE.Vector3(
      mt*mt*transitionStartPos.x + 2*mt*t*transitionControl.x + t*t*transitionEndPos.x,
      mt*mt*transitionStartPos.y + 2*mt*t*transitionControl.y + t*t*transitionEndPos.y,
      mt*mt*transitionStartPos.z + 2*mt*t*transitionControl.z + t*t*transitionEndPos.z,
    );
    camera.position.copy(pos);

    // 注视目标平滑过渡
    const look = new THREE.Vector3().lerpVectors(transitionStartLook, transitionEndLook, t);
    camera.lookAt(look);

    // 更新 currentStage（可能在过渡中到达下一阶段）
    if (t > 0.6) {
      const newStage = targetStage;
      if (currentStage !== newStage) {
        currentStage = newStage;
        updateUI();
      }
    }
  }

  // 爱心旋转 + 呼吸
  if (heartGroup.heart) {
    heartGroup.heart.rotation.y += dt * 0.25;
    heartGroup.heart.rotation.z = Math.sin(elapsed * 0.5) * 0.08;
    const breathe = 1 + Math.sin(elapsed * 0.7) * 0.04;
    heartGroup.heart.scale.setScalar(breathe);
    if (heartGroup.glow) {
      heartGroup.glow.rotation.y = heartGroup.heart.rotation.y;
      heartGroup.glow.scale.setScalar(breathe * 1.1);
    }
  }

  // 星空旋转
  stars.rotation.y += dt * 0.01;
  stars.rotation.x += dt * 0.003;

  // 爱心灯光衰减
  const heartDist = camera.position.distanceTo(new THREE.Vector3(0, 1, -1.5));
  pinkLight.intensity = Math.max(0, 10 * Math.exp(-heartDist * 0.04));

  // 标题和副标题可见性 (只在 stage 0 可见)
  const showCover = currentStage === 0 && !isTransitioning;
  titleSprite.visible = currentStage < 2;
  subtitleSprite.visible = currentStage < 2;

  // 封面精灵透明度
  if (currentStage === 0 && isTransitioning) {
    const alpha = 1 - transitionT;
    titleSprite.material.opacity = alpha;
    subtitleSprite.material.opacity = alpha;
  } else if (currentStage === 0) {
    titleSprite.material.opacity = 1;
    subtitleSprite.material.opacity = 1;
  }

  // 照片墙可见性
  photoWalls.forEach((wall, i) => {
    if (!wall) return;
    const stageZ = stageDefs[i].z;
    const camZ = camera.position.z;
    const dist = Math.abs(camZ - (stageZ + 5.5));
    wall.visible = dist < 15;
    if (wall.visible) {
      const alpha = dist < 8 ? 1 : Math.max(0, 1 - (dist - 8) / 7);
      wall.children.forEach(child => {
        if (child.isMesh && child.material.transparent !== undefined) {
          child.material.transparent = true;
          child.material.opacity = alpha;
        }
        if (child.isPoints) {
          child.material.opacity = alpha * 0.5;
        }
      });
    }
  });

  // 最终画面可见性
  const finalDist = Math.abs(camera.position.z - stageDefs[totalStages - 1].z);
  finalPlane.visible = finalDist < 15;
  if (finalPlane.visible) {
    const finalAlpha = finalDist < 6 ? 1 : Math.max(0, 1 - (finalDist - 6) / 9);
    finalPlane.material.opacity = finalAlpha;
  }

  renderer.render(scene, camera);
}

function updateUI() {
  if (currentStage === 0) {
    hintEl.textContent = '↓ 开始旅程';
    hintEl.classList.remove('hide');
  } else if (currentStage >= totalStages - 1) {
    hintEl.textContent = '';
    hintEl.classList.add('hide');
  } else {
    hintEl.textContent = '↓ 继续向前';
    hintEl.classList.remove('hide');
  }
}

updateUI();
animate();

// ==================== 响应式处理 ====================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

  'font-size:1.2em;color:#ff6b9d;', '', 'color:#c44dff;');
</script>
